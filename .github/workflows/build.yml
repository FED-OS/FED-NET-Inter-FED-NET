name: OpenTether Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Gradle 8.2
        shell: bash
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.2/bin" >> "$GITHUB_PATH"

      - name: Build APK
        shell: bash
        run: |
          cd android
          gradle --version
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenTether-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download tun2socks
        shell: pwsh
        run: |
          $url = "https://github.com/xjasonlyu/tun2socks/releases/download/v2.7.0/tun2socks-windows-amd64.zip"
          $out = "tun2socks.zip"
          Invoke-WebRequest -Uri $url -OutFile $out -ErrorAction Stop
          Expand-Archive -Path $out -DestinationPath "tun2socks_temp" -Force
          $exe = Get-ChildItem -Path "tun2socks_temp" -Filter "tun2socks*.exe" -Recurse -File | Select-Object -First 1
          if (-not $exe) { throw "No tun2socks executable found." }
          Copy-Item -Force $exe.FullName "desktop\tun2socks.exe"

      - name: Download Wintun
        shell: pwsh
        run: |
          $version = "0.14.1"
          $zip = "wintun.zip"
          $extractDir = "wintun-extracted"
          $url = "https://www.wintun.net/builds/wintun-$version.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -ErrorAction Stop
          Expand-Archive -Path $zip -DestinationPath $extractDir -Force
          $dll = Get-ChildItem -Path $extractDir -Recurse -Filter wintun.dll |
            Where-Object { $_.FullName -match '[\\/]bin[\\/]amd64[\\/]' } |
            Select-Object -First 1
          if (-not $dll) {
            Write-Host "Extracted files:"
            Get-ChildItem -Path $extractDir -Recurse | Select-Object FullName
            throw "AMD64 wintun.dll not found."
          }
          Copy-Item $dll.FullName -Destination "desktop\wintun.dll" -Force

      - name: Download ADB (latest)
        shell: pwsh
        run: |
          $url = "https://dl.google.com/android/repository/platform-tools-latest-windows.zip"
          $out = "platform-tools.zip"
          Invoke-WebRequest -Uri $url -OutFile $out -ErrorAction Stop
          Expand-Archive -Path $out -DestinationPath "desktop\" -Force

      - name: Verify bundled binaries
        shell: pwsh
        run: |
          Get-Item desktop\tun2socks.exe
          Get-Item desktop\wintun.dll
          Get-Item desktop\platform-tools\adb.exe
          & desktop\tun2socks.exe --help
          & desktop\platform-tools\adb.exe version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          cd desktop
          pyinstaller --onedir --name OpenTetherRouter start_tether.py
          Copy-Item tun2socks.exe dist\OpenTetherRouter\
          Copy-Item wintun.dll dist\OpenTetherRouter\
          Copy-Item -Recurse platform-tools dist\OpenTetherRouter\platform-tools

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenTether-Desktop
          path: desktop/dist/OpenTetherRouter/
